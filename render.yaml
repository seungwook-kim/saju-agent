# Render 블루프린트: 저장소를 연결하면 이 설정대로 무료 웹 서비스를 만든다
services:
  - type: web
    name: saju-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: LOVE_FORTUNE_CHAT           # 상담 채팅은 공개 서버에서 잠시 막아 둔다 (켜려면 1)
        value: "0"
      - key: LOVE_FORTUNE_CHAT_PER_DAY   # 채팅을 켜면 한 사람당 하루 질문 수 (IP·쿠키·결과·사주 중 하나라도 다 쓰면 막음)
        value: "5"
      - key: LOVE_FORTUNE_CHAT_GLOBAL_PER_DAY   # 모두 합쳐 하루 질문 상한 (우회해도 요금이 이 이상 안 나감)
        value: "300"
      - key: LOVE_FORTUNE_TRUST_PROXY    # Render 프록시 뒤라 방문자 IP 를 X-Forwarded-For 로 본다 (요청 횟수 제한)
        value: "1"
      - key: LOVE_FORTUNE_AI_PER_HOUR    # 한 시간에 부르는 AI 상한 (요금 보호)
        value: "300"
      - key: LOVE_FORTUNE_PREFETCH       # 방문자마다 AI 풀이를 미리 만들지 않는다 (비용)
        value: "0"
      - key: LOVE_FORTUNE_AI_BACKEND     # AI 풀이를 쓰려면 openrouter + 아래 두 값
        value: openrouter
      - key: LOVE_FORTUNE_OPENROUTER_MODEL
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: SUPABASE_URL               # Supabase 프로젝트 주소 (https://xxxx.supabase.co), 대시보드에서 넣는다
        sync: false
      - key: SUPABASE_SECRET_KEY        # Supabase 서버 전용 키 (sb_secret_... 또는 service_role), 대시보드에서 넣는다
        sync: false
