[project]
name = "love-fortune-imagegen"
version = "0.1.0"
description = "종합 사주 앱의 가상 인물 이미지 생성 서버 (로컬 GPU, Stable Diffusion XL)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.7",
    "diffusers>=0.32",
    "transformers>=4.46",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "pillow>=10",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
